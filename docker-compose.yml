# docker compose up --build              (API + UI + Redis + 2 workers)
# docker compose up --scale worker=4     (throughput benchmark vs worker count)
# WITH_ML=1 docker compose up --build    (include torch/transformers/mediapipe)
x-app: &app
  build: {context: ., args: {WITH_ML: "${WITH_ML:-0}"}}
  environment: {REDIS_URL: "redis://redis:6379/0", DB_PATH: /app/data/truthlens.db, UPLOAD_DIR: /app/data/uploads, MODEL_DIR: /app/models}
  volumes: ["./data:/app/data", "./models:/app/models", "./reports:/app/reports"]
  depends_on: [redis]
services:
  redis: {image: "redis:7-alpine"}
  api:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: rq worker --url redis://redis:6379/0
    deploy: {replicas: 2}
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    profiles: ["tracking"]
